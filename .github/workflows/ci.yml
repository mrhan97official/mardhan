# Checks every push with the real compilers before Vercel deploys it:
# Go (build + tests, vet as a report) and the Next.js build.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go · build & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...
      - name: go vet (laporan, tidak menggagalkan build)
        continue-on-error: true
        run: go vet ./...

  web:
    name: Next.js · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package-lock.json belum ter-commit; memakai npm install (versi paket bisa berubah antar build)."
            npm install --no-audit --no-fund
          fi
      - name: next build (termasuk pemeriksaan TypeScript)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
